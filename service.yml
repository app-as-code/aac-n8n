service:
  name: aac-n8n
  image_repo: n8nio/n8n
  image_tag: 3.0.1
  description: Low-Code Automatisierungsplattform
  icon: n8n.png
  category: Automation
  stage: prod
  hostname: n8n
ports:
- name: web
  port: 5678
  external_port: 5678
  protocol: TCP
config:
  domain_name: example.com
  generate_hostname: false
  integrations:
    homepage:
      enabled: true
    autodns:
      enabled: true
    traefik:
      enabled: true
      cert_resolver: ionos
      entrypoint: websecure
  schema_version: 2
stage_overrides:
  prod:
    config:
      generate_hostname: false
    service:
      hostname: n8n
secrets:
  DB_POSTGRESDB_PASSWORD: CHANGE_ME
  POSTGRES_DB: n8n
  POSTGRES_USER: n8n
  POSTGRES_PASSWORD: CHANGE_ME
volumes:
  config:
    description: n8n configuration, database, and workflows
  redis:
    description: Data for redis
  netl_feser:
    type: bind
    source: /mnt/homenas/server/n8n
  db_data:
    description: Data for database
deployment_strategy:
  main:
    enabled: true
    target_stage: prod
  dev:
    enabled: true
    target_stage: dev
  test:
    enabled: false
    target_stage: test
  ansible-dev:
    enabled: true
    target_stage: dev
  iac-dev:
    enabled: true
    target_stage: dev
  template-dev:
    enabled: true
    target_stage: dev
deployments:
  docker_compose:
    restart_policy: always
    host_base_path: /export/docker
    volumes:
    - config:/home/node/.n8n
    - netl_feser:/mnt/n8n
    environment:
      N8N_PROXY_HOPS: '{{ vars.N8N_PROXY_HOPS }}'
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: '{{ vars.N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        }}'
      DB_POSTGRESDB_USER: '{{ vars.DB_POSTGRESDB_USER }}'
      N8N_REDIS_PORT: '{{ vars.N8N_REDIS_PORT }}'
      WEBHOOK_URL: '{{ vars.WEBHOOK_URL }}'
      TZ: '{{ vars.TZ }}'
      WEBHOOK_TUNNEL_URL: '{{ vars.WEBHOOK_TUNNEL_URL }}'
      DB_POSTGRESDB_HOST: '{{ vars.DB_POSTGRESDB_HOST }}'
      N8N_PORT: '{{ vars.N8N_PORT }}'
      N8N_HOST: '{{ vars.N8N_HOST }}'
      PUID: '{{ vars.PUID }}'
      N8N_PROTOCOL: '{{ vars.N8N_PROTOCOL }}'
      DB_TYPE: '{{ vars.DB_TYPE }}'
      PGID: '{{ vars.PGID }}'
      N8N_RUNNERS_ENABLED: '{{ vars.N8N_RUNNERS_ENABLED }}'
      DB_POSTGRESDB_DATABASE: '{{ vars.DB_POSTGRESDB_DATABASE }}'
      DB_POSTGRESDB_PORT: '{{ vars.DB_POSTGRESDB_PORT }}'
      N8N_REDIS_HOST: '{{ vars.N8N_REDIS_HOST }}'
      DB_POSTGRESDB_PASSWORD: '{{ secrets.DB_POSTGRESDB_PASSWORD }}'
      POSTGRES_DB: '{{ secrets.POSTGRES_DB }}'
      POSTGRES_USER: '{{ secrets.POSTGRES_USER }}'
      POSTGRES_PASSWORD: '{{ secrets.POSTGRES_PASSWORD }}'
dependencies:
  redis:
    import: catalog/redis.yml
    overrides:
      name: aac-n8n-redis
      image_tag: 8.6.1
      volumes:
        redis:
          target: /data
          description: Persistent storage for redis
      environment:
        TZ: '{{ vars.TZ }}'
        PUID: '{{ vars.PUID }}'
        PGID: '{{ vars.PGID }}'
  database:
    import: catalog/postgres.yml
    overrides:
      name: aac-n8n-db
      image_tag: 18
      volumes:
        db:
          target: /var/lib/postgresql
          description: Persistent storage for db
      environment:
        TZ: '{{ vars.TZ }}'
        PUID: '{{ vars.PUID }}'
        PGID: '{{ vars.PGID }}'
vars:
  N8N_PROXY_HOPS: '1'
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
  DB_POSTGRESDB_USER: n8n
  N8N_REDIS_PORT: '6379'
  WEBHOOK_URL: https://n8n.example.com
  TZ: Europe/Berlin
  WEBHOOK_TUNNEL_URL: https://n8n.example.com
  DB_POSTGRESDB_HOST: n8n.example.com
  N8N_PORT: '5678'
  N8N_HOST: n8n.example.com
  PUID: '1000'
  N8N_PROTOCOL: https
  DB_TYPE: postgresdb
  PGID: '1000'
  N8N_RUNNERS_ENABLED: 'true'
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_PORT: '5432'
  N8N_REDIS_HOST: n8n.example.com

services:
  # --- Main Application Service ---
  aac-n8n:
    image: "n8nio/n8n:3.0.1"
    container_name: "aac-n8n"
    hostname: "n8n"
    restart: "always"


    environment:
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      DB_POSTGRESDB_USER: "n8n"
      N8N_REDIS_PORT: "6379"
      WEBHOOK_URL: "https://n8n.example.com"
      TZ: "Europe/Berlin"
      WEBHOOK_TUNNEL_URL: "https://n8n.example.com"
      DB_POSTGRESDB_HOST: "n8n.example.com"
      N8N_PORT: "5678"
      N8N_HOST: "n8n.example.com"
      PUID: "1000"
      N8N_PROTOCOL: "https"
      DB_TYPE: "postgresdb"
      PGID: "1000"
      N8N_RUNNERS_ENABLED: "true"
      DB_POSTGRESDB_DATABASE: "n8n"
      DB_POSTGRESDB_PORT: "5432"
      N8N_REDIS_HOST: "n8n.example.com"
      DB_POSTGRESDB_PASSWORD: "${DB_POSTGRESDB_PASSWORD:?set DB_POSTGRESDB_PASSWORD in .env (see .env.example)}"
      POSTGRES_DB: "n8n"
      POSTGRES_USER: "n8n"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}"
    ports:
      - "5678:5678/tcp"

    volumes:
      - "/export/docker/aac-n8n/config:/home/node/.n8n"
      - "/mnt/homenas/server/n8n:/mnt/n8n"

    networks:
      - exposed
      - interconnect
      - secured
      - stack_internal

    labels:
      traefik.enable: "true"
      traefik.http.routers.aac-n8n.rule: "Host(`n8n.example.com`)"
      traefik.http.routers.aac-n8n.entrypoints: "websecure"
      traefik.http.routers.aac-n8n.tls: "true"
      traefik.http.routers.aac-n8n.tls.certresolver: "ionos"
      traefik.docker.network: "services-secured"
      traefik.http.services.aac-n8n.loadbalancer.server.port: "5678"
      traefik.http.services.aac-n8n.loadbalancer.server.scheme: "http"
      auto-dns.createWildcard.aac-n8n: "false"
      auto-dns.customDNS.aac-n8n: "true"
      auto-dns.customDOMAIN.aac-n8n: "example.com"
      auto-dns.customHost.aac-n8n: "n8n"
      homepage.group: "Automation"
      homepage.name: "N8N"
      homepage.href: "https://n8n.example.com"
      homepage.icon: "n8n.png"
      homepage.description: "Low-Code Automatisierungsplattform"


    depends_on:
      aac-n8n-redis:
        condition: service_healthy
      aac-n8n-db:
        condition: service_healthy


  # --- Service Dependencies (Sidecars) ---
  aac-n8n-redis:
    image: "redis:8.6.1"
    container_name: "aac-n8n-redis"
    restart: "always"
    

    env_file:
      - .env
    environment:
      TZ: "Europe/Berlin"
      PUID: "1000"
      PGID: "1000"


    volumes:
      - "/export/docker/aac-n8n/redis-data:/data"
      - "/export/docker/aac-n8n/redis:/data"

    networks:
      - stack_internal


    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5


  aac-n8n-db:
    image: "postgres:18"
    container_name: "aac-n8n-db"
    restart: "always"
    

    env_file:
      - .env
    environment:
      TZ: "Europe/Berlin"
      PUID: "1000"
      PGID: "1000"


    volumes:
      - "/export/docker/aac-n8n/db:/var/lib/postgresql"

    networks:
      - stack_internal


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 30s
      timeout: 5s
      retries: 5



networks:
  secured:
    name: "services-secured"
    external: true
  exposed:
    name: "services-exposed"
    external: true
  interconnect:
    name: "docker-default"
    external: true
  stack_internal:
    name: "aac-n8n_stack_internal"
    driver: "bridge"

